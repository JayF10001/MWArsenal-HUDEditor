<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MWArsenal HUD Layout Editor</title>
    <script>
      (() => {
        const key = "mwarsenal-hud-editor-theme";
        let preference = "light";
        try {
          const stored = window.localStorage.getItem(key);
          if (stored === "dark" || stored === "light") {
            preference = stored;
          }
        }
        catch {
          // Light remains the default when local storage is unavailable.
        }
        document.documentElement.dataset.theme = preference;
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DsfqHwsm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CmPjo8uI.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
